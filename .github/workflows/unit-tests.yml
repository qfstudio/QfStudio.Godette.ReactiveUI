name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godotsharp-version: [4.0, 4.1, 4.2, 4.3, 4.4, 4.5, 4.6. 4.7]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Set GodotSharp package version
      run: |
        dotnet add package GodotSharp --version ${{ matrix.godotsharp-version }} --project ./QfStudio.Godette.ReactiveUI/QfStudio.Godette.ReactiveUI.csproj
        dotnet list ./QfStudio.Godette.sln package
    - name: Restore dependencies
      run: dotnet restore ./QfStudio.Godette.sln
    - name: Build
      run: dotnet build --no-restore ./QfStudio.Godette.sln
    - name: Test
      run: dotnet test --no-build --verbosity normal ./QfStudio.Godette.sln
